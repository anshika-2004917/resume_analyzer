<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ATS Result</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f7;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            margin: auto;
            padding: 20px;
        }

        .header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
            border-radius: 10px;
        }

        .card {
            background: white;
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px #ccc;
        }

        .score-box {
            font-size: 40px;
            font-weight: bold;
            color: #27ae60;
            text-align: center;
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 10px;
            color: #2c3e50;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
        }

        .tag {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 5px 10px;
            margin: 5px;
            border-radius: 5px;
            font-size: 14px;
        }

        .missing {
            background-color: #e74c3c;
        }

        .suggestion {
            background-color: #f39c12;
            padding: 10px;
            border-radius: 5px;
            color: white;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .btn:hover {
            background-color: #1a252f;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📊 ATS Resume Analysis Result</h1>
        <p>Your resume evaluation report</p>
    </div>

    <!-- ATS SCORE -->
    <div class="card">
        <h2 class="section-title">ATS Score</h2>
        <div class="score-box">
            {{ ats_score }}%
        </div>
    </div>

    <!-- MATCHED SKILLS -->
    <div class="card">
        <h2 class="section-title">Matched Skills</h2>

        {% for skill in matched_skills %}
            <span class="tag">{{ skill }}</span>
        {% endfor %}
    </div>

    <!-- MISSING SKILLS -->
    <div class="card">
        <h2 class="section-title">Missing Skills</h2>

        {% for skill in missing_skills %}
            <span class="tag missing">{{ skill }}</span>
        {% endfor %}
    </div>

    <!-- SUGGESTIONS -->
    <div class="card">
        <h2 class="section-title">Suggestions</h2>

        <div class="suggestion">
            {{ suggestions }}
        </div>
    </div>

    <!-- BACK BUTTON -->
    <div class="card" style="text-align:center;">
        <a href="/dashboard" class="btn">⬅ Back to Dashboard</a>
    </div>

</div>

</body>
</html>
