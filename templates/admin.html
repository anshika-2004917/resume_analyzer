<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <style>
        body{
            font-family: Arial;
            background:#eef2f7;
        }

        .container{
            width:90%;
            margin:auto;
        }

        .card{
            background:white;
            padding:20px;
            margin-top:20px;
            border-radius:10px;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th,td{
            border:1px solid #ddd;
            padding:10px;
            text-align:center;
        }

        th{
            background:#2c3e50;
            color:white;
        }

        .stats{
            display:flex;
            gap:20px;
        }

        .box{
            flex:1;
            background:white;
            padding:20px;
            text-align:center;
            border-radius:10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>👨‍💼 Admin Dashboard</h1>

    <div class="stats">

        <div class="box">
            <h2>{{ user_count }}</h2>
            <p>Total Users</p>
        </div>

        <div class="box">
            <h2>{{ resume_count }}</h2>
            <p>Total Resumes</p>
        </div>

        <div class="box">
            <h2>{{ analysis_count }}</h2>
            <p>Total Analyses</p>
        </div>

    </div>

    <div class="card">

        <h2>Registered Users</h2>

        <table>

            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Created At</th>
            </tr>

            {% for user in users %}
            <tr>
                <td>{{ user.id }}</td>
                <td>{{ user.username }}</td>
                <td>{{ user.email }}</td>
                <td>{{ user.created_at }}</td>
            </tr>
            {% endfor %}

        </table>

    </div>

</div>

</body>
</html>
